GPIO:
  PA4:
    Signal: GPIO_Output
Peripherals:
  ADC: {}
  SPI:
    SPI1:
      BaudRate: 8.0 MBits/s
      Direction: SPI_DIRECTION_2LINES
      dma:
        dma_tx: &id003
          request_id: '4'
          peripheral: SPI1_TX
          dma_type: DMA
          stream: DMA1_Channel3
          direction: PERIPH
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
  USART:
    UART5:
      Mode: Asynchronous
    USART1:
      Mode: Asynchronous
      dma:
        dma_rx: &id004
          request_id: '3'
          peripheral: USART1_RX
          dma_type: DMA
          stream: DMA1_Channel5
          direction: MEMORY
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
        dma_tx: &id005
          request_id: '2'
          peripheral: USART1_TX
          dma_type: DMA
          stream: DMA1_Channel4
          direction: PERIPH
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
  I2C:
    I2C1:
      AddressingMode: 7-bit
      DualAddressMode: false
      NoStretchMode: false
      Pins:
        SCL: PB6
        SDA: PB7
      dma:
        dma_rx: &id001
          request_id: '0'
          peripheral: I2C1_RX
          dma_type: DMA
          stream: DMA1_Channel7
          direction: MEMORY
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
        dma_tx: &id002
          request_id: '1'
          peripheral: I2C1_TX
          dma_type: DMA
          stream: DMA1_Channel6
          direction: PERIPH
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: High
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
DMA:
  Requests:
    '0': I2C1_RX
    '1': I2C1_TX
    '2': USART1_TX
    '3': USART1_RX
    '4': SPI1_TX
    sNb: '5'
  Configurations:
    I2C1_RX_0: *id001
    I2C1_TX_1: *id002
    SPI1_TX_4: *id003
    USART1_RX_3: *id004
    USART1_TX_2: *id005
Timebase:
  Source: TIM1
  IRQ: TIM1_UP_IRQn
